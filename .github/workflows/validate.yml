name: Profile validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify profile README
        run: |
          test -s README.md
          grep -q "Muhammad Faizan" README.md
          grep -q "Featured Projects" README.md
      - name: Check workflow YAML syntax
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f, aliases: true); puts "validated #{f}" }'
